<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부산 편의지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header><div class="brand">부산 <b>편의지도</b></div><form id="searchForm" class="search"><input id="search" placeholder="카페, 화장실, 주차장 등 장소를 검색하세요" autocomplete="off" /><button>검색</button></form></header>
    <main>
      <aside>
        <h1>내 주변, 더 편리하게</h1><p class="sub">카카오 장소 검색으로 선택한 반경의 부산 시설을 찾아드려요.</p>
        <button id="locate" class="primary">⌖ 내 위치 정보 찾기</button><p id="status" class="status">위치를 찾은 뒤 검색어를 입력해 주세요.</p>
        <section id="info" class="info"><small>장소 검색</small><h2>검색 결과를 선택해 주세요</h2><p>위치 확인 후 원하는 시설을 검색하세요.</p></section>
        <span class="label">검색한 주변 시설</span><ul id="results" class="results"><li>검색 결과가 여기에 표시됩니다.</li></ul><button id="more" class="more" hidden></button>
      </aside>
      <section class="map-wrap"><div id="map"></div><div class="map-label">📍 부산 편의시설 지도<small id="mapNote">위치 찾기 후 반경을 적용합니다</small></div>
        <div class="radius"><b>검색 반경</b><p>선택한 거리 전체에서 시설을 찾습니다.</p><div id="radiusButtons"></div></div>
        <section class="route"><h3 id="routeTitle">장소를 선택해 주세요</h3><p id="routeText">검색 결과의 핀을 누르면 길찾기를 이용할 수 있습니다.</p><div id="modes" class="modes"><button class="active" data-mode="walk">🚶 도보</button><button data-mode="traffic">🚌 대중교통</button><button data-mode="car">🚗 자동차</button></div><button id="routeButton" class="primary">카카오맵에서 도보 길찾기</button></section>
      </section>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./app.js"></script>
</body>
</html>
